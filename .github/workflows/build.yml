name: Build Android ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-android" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_CXX_FLAGS="-D__ANDROID__ -DANDROID -D_LINUX -I$GITHUB_WORKSPACE/mock_xbox_sdk" \
            -DWORLD_LIB="$GITHUB_WORKSPACE/build-android/libMinecraft.World.a"

      - name: Build Minecraft.World
        run: cmake --build "$GITHUB_WORKSPACE/build-android" --target Minecraft.World -j2

      - name: Stage Minecraft.World archive for Client
        run: |
          world_archive="$(find "$GITHUB_WORKSPACE/build-android" -type f -name 'Minecraft.World.a' -print -quit)"
          test -n "$world_archive"
          cp "$world_archive" "$GITHUB_WORKSPACE/build-android/libMinecraft.World.a"

      - name: Build Minecraft.Client
        run: cmake --build "$GITHUB_WORKSPACE/build-android" --target Minecraft.Client -j2

      - name: Upload Android ARM64 library
        uses: actions/upload-artifact@v7
        with:
          name: libMinecraft.Client-android-arm64
          path: Linux/Debug/libMinecraft.Client.so
          if-no-files-found: error
